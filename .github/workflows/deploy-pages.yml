name: Deploy Mock Version to GitHub Pages

on:
  # 当推送到 main 或 vibe-dev 分支时自动触发部署
  push:
    branches:
      - main
      - vibe-dev
  # 支持在 GitHub 仓库 Actions 页面手动一键触发运行
  workflow_dispatch:

# 设置 GitHub Pages 部署所需的 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 保证同一时间只有一个 Pages 部署在运行，避免并发冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Node.js 22 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. 安装 pnpm 包管理器
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # 4. 安装项目依赖
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 5. 初始化配置 GitHub Pages 环境（在 build 前执行以获取 base_path）
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # 6. 编译打包（强制开启 Mock 仿真模式并注入 Pages 子路径）
      - name: Build project (Mock Mode)
        env:
          VITE_ENABLE_MOCK: "true"
          VITE_TRANSPORT: "mock"
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/smalux_frontend/' }}
        run: pnpm run build

      # 7. 写入 .nojekyll 并生成 404.html 防止 GitHub 过滤静态资源与 SPA 刷新 404
      - name: Configure GitHub Pages routing & disable Jekyll
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      # 8. 上传构建产物至 GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      # 9. 执行 GitHub Pages 发布
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
